<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7A52">
<title>中藥 科中／飲片（含庫存）儲位查詢｜台中慈濟醫院藥學部</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0F7A52; --green-dark:#0A5C3D;
  --ink:#16211C; --ink-soft:#5F6F67;
  --card:#FFFFFF; --bg:#F4F7F5; --line:#DCE7E1; --r:14px; --reserve:34px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;
  font-size:17px;line-height:1.6;padding-bottom:calc(30px + env(safe-area-inset-bottom))}

.hero{position:relative;overflow:hidden;text-align:center;color:#fff;
  background:linear-gradient(155deg,#128A5C 0%,var(--green) 45%,var(--green-dark) 100%);
  padding:calc(9px + env(safe-area-inset-top)) 8px 9px;border-radius:0 0 16px 16px}
.hero::after{content:"";position:absolute;inset:0;opacity:.13;pointer-events:none;
  background:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 40px),
             repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 40px)}
.hero .inner{position:relative;z-index:1}
.leaf{width:24px;height:24px;margin-bottom:1px;opacity:.95}
.hero h1{margin:0;font-size:clamp(16px, 5vw, 34px);font-weight:900;letter-spacing:.01em;
  line-height:1.3;white-space:nowrap}
.hero h1 em{font-style:normal;font-size:1em;letter-spacing:0;line-height:1.1}
.hero h1 .tail{font-size:1em;font-weight:900;opacity:1;letter-spacing:0}
.hero .sub{margin-bottom:2px;font-size:clamp(13px, 3.4vw, 20px);opacity:.94;letter-spacing:.05em;
  font-weight:500;white-space:nowrap}

.searchwrap{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 6px 4px}
.field{display:flex;align-items:center;gap:9px;background:var(--card);border:2px solid var(--green);
  border-radius:999px;padding:12px 16px;box-shadow:0 6px 16px -10px rgba(15,122,82,.55)}
.field svg{flex:0 0 auto;color:var(--green)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;
  font-size:18px;font-weight:500;color:var(--ink)}
#q::placeholder{color:#9DB0A7;font-weight:400}
.clear{border:0;background:#E7EDEA;color:var(--ink-soft);width:26px;height:26px;border-radius:50%;
  font-size:16px;line-height:1;cursor:pointer;display:none;flex:0 0 auto}

.status{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:4px 8px 0;font-size:12.5px;color:var(--ink-soft)}
.status button{border:1px solid var(--line);background:var(--card);color:var(--green);
  font-family:inherit;font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:999px;cursor:pointer}

.list{padding:5px 6px 0;display:grid;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 96px 74px var(--reserve);align-items:center;gap:10px;
  background:var(--card);border:2px solid #B9CBC1;border-left-width:7px;border-radius:12px;
  padding:12px 12px;box-shadow:0 2px 8px -4px rgba(22,33,28,.25);cursor:pointer;
  transition:transform .1s,border-color .1s}
.item>*{min-width:0}
.item .name{overflow:visible;width:100%}
.item.herbcard{border-left-color:var(--green-dark)}
.item.extcard{border-left-color:#1B3E7A}
.item.nocard{border-left-color:#B9CBC1}
.side{width:var(--reserve);display:flex;align-items:center;justify-content:center}
.item:active{transform:scale(.985);border-color:var(--green)}
.item:hover{border-color:var(--green)}
.item:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.name{font-size:34px;font-weight:700;letter-spacing:0;line-height:1.2;
  display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;min-width:0}
.name .txt{white-space:normal;word-break:break-word}
.name{overflow:hidden}
.name mark{background:#FFE9A8;color:inherit;border-radius:3px;padding:0 1px}
.tag{display:inline-block;flex:0 0 auto;white-space:nowrap;color:#fff;
  font-size:18px;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:6px;white-space:nowrap}
.tag.herb{background:var(--green-dark)}          /* 飲片：深綠 */
.tag.ext{background:#1B3E7A}                     /* 科中：深藍 */
.slot.ext{background:#2A5AA8}                    /* 科中儲位牌 */
.cslot{display:flex;justify-content:center;align-items:center;width:100%}
.cslot2{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;width:100%}
.slotrow{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap}
.slot2{background:#FFD54A;color:#3A2E00;border:1px solid #E3B92E;border-radius:8px;
  padding:5px 8px;font-size:17px;font-weight:900;letter-spacing:.02em;line-height:1.1;
  text-align:center;white-space:nowrap;box-shadow:0 1px 4px -2px rgba(0,0,0,.3)}
.slot2 .k{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;opacity:.75;margin-bottom:1px}
.slot2 mark{background:rgba(255,255,255,.45);border-radius:3px}
.brand{font-size:16px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em;
  word-break:break-all;line-height:1.2;white-space:nowrap}
.cold{display:inline-block;background:#E3F2FB;border:1px solid #B7DCF0;color:#1A5C86;
  font-size:14px;font-weight:700;padding:4px 6px;border-radius:6px;line-height:1.25;
  text-align:center;white-space:nowrap}
.slot{width:100%;min-width:0;text-align:center;background:var(--green);color:#fff;
  border-radius:9px;padding:7px 9px;font-size:23px;font-weight:900;letter-spacing:.02em;
  line-height:1.12;word-break:break-all}
.slot mark{background:rgba(255,255,255,.32);color:#fff;border-radius:3px}

.empty{text-align:center;padding:44px 20px;color:var(--ink-soft);font-size:14px}
.empty .big{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:5px}
.err{margin:12px;padding:12px 14px;border-radius:12px;background:#FDECEA;border:1px solid #F0B4AC;
  color:#9B2C1E;font-size:13.5px;line-height:1.7;word-break:break-all}

.todaybox{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));
  background:rgba(15,122,82,.10);color:var(--green-dark);border:1px solid rgba(15,122,82,.25);
  font-size:12px;font-weight:500;padding:5px 11px;border-radius:999px;z-index:25;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);background:var(--ink);color:#fff;font-size:14px;font-weight:500;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}

footer{margin-top:22px;padding:16px 14px calc(20px + env(safe-area-inset-bottom));
  font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.9;border-top:1px solid var(--line)}
.motto{color:var(--green);letter-spacing:.2em;font-weight:700;font-size:2em;margin-bottom:8px;line-height:1.4}
.org{color:var(--ink);font-weight:700;font-size:1.8em;line-height:1.5}
.lead{font-size:1.5em;line-height:1.6;margin-top:2px}
.assist{font-size:1.3em;line-height:1.6;margin-top:2px}
.maker{font-size:1.3em;line-height:1.6;margin-top:2px}
.ver{margin-top:6px;font-size:11px;opacity:.75}

@media (min-width:640px){
  .searchwrap,.list,.status{max-width:100%;margin-left:auto;margin-right:auto}
  .name{font-size:38px}
  .slot{font-size:24px;min-width:84px}
}
@media (max-width:400px){
  .hero h1{font-size:clamp(15px,4.6vw,20px)}
  .name{font-size:28px}
  .slot{font-size:22px;min-width:66px;padding:6px 8px}
  .slot2{font-size:15px;padding:5px 7px}
  .tag{font-size:15px;padding:3px 7px}
  .brand{font-size:14px}
}
</style>
</head>
<body>

<div class="hero">
  <div class="inner">
    <div class="sub">台中慈濟醫院 藥學部</div>
    <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 20c0-8 5-14 14-15 1 9-4 15-11 15H5z"/><path d="M5 20c3-4 6-6 10-7.5"/>
    </svg>
    <h1>中藥科中／飲片（含庫存）儲位查詢</h1>
  </div>
</div>

<div class="searchwrap">
  <div class="field">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
    </svg>
    <input id="q" type="search" inputmode="search" placeholder="輸入藥名或儲位…" autocomplete="off">
    <button class="clear" id="clear" aria-label="清除">✕</button>
  </div>
</div>

<div class="status">
  <span id="count">載入中…</span>
  <button id="refresh">↻ 重新載入</button>
</div>

<div id="out"></div>

<footer>
  <div class="motto">格物致知・誠意正心</div>
  <div class="org">台中慈濟醫院 藥學部</div>
  <div class="lead">指導：陳綺華 部主任、李雅蓁 科主任</div>
  <div class="assist">協力：張紀卿、胡家瑜、張雅婷</div>
  <div class="maker">製作：許文馨</div>
  系統維護：施瑢家、李家豪、李紀賢
  <div class="ver">版本：2026.8.5</div>
</footer>

<div id="today" class="todaybox"></div>
<div id="toast"></div>

<script>
/* ===== 資料來源：Google 試算表「中藥查詢儲位」 =====
   只讀 工作表1
   欄位：A 儲位、B 中藥名、C 冰庫、D 藥庫儲位、E 廠牌（第 1 列為標題）
   類別依「儲位開頭」自動判定：
     1 個英文字母(A103) → 科中（藍牌）
     2 個英文字母(RA01) → 飲片（綠牌）
     開頭中文(自04)     → 不顯示類別標籤
   試算表需設定：共用 → 知道連結的任何人 → 檢視者        */
var SHEET_ID = "1kd_RkujWUHfpo6SJmvicN9PrBFqK3QeZps4fHuoFdNg";
var SOURCES = [
  // col：0=A儲位 1=B中藥名 2=C冰庫 3=D藥庫儲位 4=E廠牌
  { sheet: "工作表1",
    col: { slot:0, name:1, note:2, slot2:3, brand:4 } }
];

var HOME_LIMIT = 5, SEARCH_LIMIT = 50;

/* ===== 查詢次數統計（選用）=====
   把部署好的 GAS 網址填進 COUNT_URL 即啟用。
   有輸入關鍵字、停止打字 1 秒後計一次；不記名、不記內容。 */
var COUNT_URL = "https://script.google.com/macros/s/AKfycbyaBcGvel2KXiLbq5HGhyM2elh6930e6NmHfpb4PY27nwtWUhUhOvKWItcINIjvnA21/exec";
var countTimer = null, counted = false;
function applyToday(res){
  var el = document.getElementById("today");
  if(!el) return;
  var t = (res && typeof res.today !== "undefined") ? res.today : 0;
  var sum = (res && typeof res.total !== "undefined") ? res.total : null;
  el.textContent = "今日查詢 " + t + " 次" + (sum != null ? "　·　累計 " + sum + " 次" : "");
}
function callCount(action){
  if(!COUNT_URL) return;
  var cb = "cntCB" + Math.random().toString(36).slice(2);
  window[cb] = function(res){
    try{ applyToday(res); }catch(e){}
    try{ delete window[cb]; }catch(e){}
    if(sc.parentNode) sc.parentNode.removeChild(sc);
  };
  var sc = document.createElement("script");
  sc.src = COUNT_URL + "?action=" + action + "&callback=" + cb + "&_=" + Date.now();
  sc.onerror = function(){ if(sc.parentNode) sc.parentNode.removeChild(sc); };
  document.body.appendChild(sc);
}
function bumpCount(){
  var term = q.value.trim();
  if(!term){ counted = false; return; }   // 清空 → 重置，下次再算
  if(counted) return;                      // 這次查詢已計過，不重複
  counted = true;
  callCount("hit");
}

var DATA = [];
function $(s){ return document.querySelector(s); }
var q = $("#q"), out = $("#out");

function toast(m){
  var t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 1500);
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
function hl(t, keys){
  var s = esc(t);
  keys.forEach(function(k){
    if(!k) return;
    var re = new RegExp("(" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    s = s.replace(re, "<mark>$1</mark>");
  });
  return s;
}

/* CSV 解析（支援引號、逗號、換行） */
function parseCSV(text){
  var rows = [], row = [], cell = "", inQ = false;
  text = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  for(var i = 0; i < text.length; i++){
    var c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else inQ = false; }
      else cell += c;
    }else{
      if(c === '"') inQ = true;
      else if(c === ","){ row.push(cell); cell = ""; }
      else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += c;
    }
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

function scoreOf(d, term){
  var name = d.name.toLowerCase(), slot = d.slot.toLowerCase(), slot2 = (d.slot2||"").toLowerCase();
  var isEng = /^[a-z0-9]+$/.test(term);   // 純英數 → 當儲位查
  if(isEng){
    // 英文查詢：以儲位為主（局儲位 + 藥庫儲位）
    if(slot === term || slot2 === term) return 100;
    if(slot.indexOf(term) === 0 || slot2.indexOf(term) === 0) return 85;
    if(slot.indexOf(term) >= 0 || slot2.indexOf(term) >= 0) return 65;
    if(name.indexOf(term) >= 0) return 20;   // 藥名含英文也給低分
    return 0;
  }
  // 中文查詢：以藥名為主
  if(name === term) return 100;
  if(name.indexOf(term) === 0) return 85;
  if(name.indexOf(term) >= 0) return 65;
  if(slot.indexOf(term) >= 0 || slot2.indexOf(term) >= 0) return 30;
  var hay = name + slot, chars = term.split("");
  return chars.length && chars.every(function(c){ return hay.indexOf(c) >= 0; }) ? 30 + chars.length : 0;
}

function fail(msg){
  $("#count").textContent = "載入失敗";
  out.innerHTML = '<div class="err"><b>無法讀取試算表</b><br>' + esc(msg) +
    '<br>請確認試算表共用設定為「知道連結的任何人 → 檢視者」。</div>';
}

function loadSheet(src, done){
  var cb = "gvizCB" + Math.random().toString(36).slice(2);
  var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
            "/gviz/tq?tqx=out:json;responseHandler:" + cb +
            "&sheet=" + encodeURIComponent(src.sheet) +
            "&headers=0&_=" + Date.now();
  var sc = document.createElement("script");
  var timer = setTimeout(function(){ cleanup(); done([]); }, 15000);

  function cleanup(){
    clearTimeout(timer);
    try{ delete window[cb]; }catch(e){}
    if(sc.parentNode) sc.parentNode.removeChild(sc);
  }

  window[cb] = function(res){
    var items = [];
    try{
      var rows = (res && res.table && res.table.rows) ? res.table.rows : [];
      var C = src.col;
      items = rows.map(function(r){
        var c = r.c || [];
        function val(i){
          if(i < 0 || !c[i]) return "";
          var v = (c[i].v != null) ? c[i].v : (c[i].f != null ? c[i].f : "");
          return String(v).trim();
        }
        var slot = val(C.slot);
        // 依儲位開頭判類別
        var type = "", cls = "";
        var m = slot.match(/^([A-Za-z]+)/);   // 開頭連續英文字母
        if(m){
          if(m[1].length >= 2){ type = "飲片"; cls = "herb"; }
          else { type = "科中"; cls = "ext"; }
        } // 開頭非英文（中文）→ type/cls 留空，不顯示標籤
        return {
          slot:  slot,
          name:  val(C.name),
          brand: val(C.brand),
          note:  val(C.note),
          slot2: val(C.slot2),
          type:  type,
          cls:   cls
        };
      }).filter(function(d){
        if(!d.name) return false;
        if(d.name === "中藥名" || d.slot === "儲位") return false;   // 標題列
        return true;
      });
    }catch(e){}
    cleanup();
    done(items);
  };

  sc.src = url;
  sc.onerror = function(){ cleanup(); done([]); };   // 分頁不存在也不影響其他分頁
  document.body.appendChild(sc);
}

function load(){
  $("#count").textContent = "載入中…";
  out.innerHTML = "";
  DATA = [];
  var left = SOURCES.length;
  SOURCES.forEach(function(src){
    loadSheet(src, function(items){
      DATA = DATA.concat(items);
      if(--left === 0){
        if(!DATA.length){
          fail("讀不到資料，請確認試算表共用設定為「知道連結的任何人 → 檢視者」");
        }else{
          render();
        }
      }
    });
  });
}

/* 量測後自動縮字：確保藥名＋標籤同一排 */
function fitNames(){
  var MAX = 48, MIN = 15;
  var els = document.querySelectorAll(".name");
  for(var i = 0; i < els.length; i++){
    var el = els[i];
    var avail = el.clientWidth;
    if(!avail) continue;
    var size = MAX;
    el.style.fontSize = size + "px";
    var guard = 0;
    while(el.scrollWidth > avail + 1 && size > MIN && guard < 90){
      size -= 1; guard++;
      el.style.fontSize = size + "px";
    }
  }
}

function render(){
  var term = q.value.replace(/[\s　]/g, "").toLowerCase();
  var keys = term ? [q.value.trim()] : [];   // 只高亮完整輸入詞

  var matched = !term ? DATA :
    DATA.map(function(d){ return { d:d, s:scoreOf(d, term) }; })
        .filter(function(x){ return x.s > 0; })
        .sort(function(a,b){ return (b.s - a.s) || (a.d.name.length - b.d.name.length); })
        .map(function(x){ return x.d; });

  var LIMIT = term ? SEARCH_LIMIT : HOME_LIMIT;
  var hit = matched.slice(0, LIMIT);

  $("#count").textContent = term
    ? "找到 " + matched.length + " 筆" + (matched.length > LIMIT ? "（顯示前 " + LIMIT + " 筆）" : "")
    : "共 " + DATA.length + " 項（飲片＋科中），請輸入藥名查詢";

  if(!hit.length){
    out.innerHTML = '<div class="empty"><div class="big">查無這個品項</div>試試藥名的其中兩個字，或直接輸入儲位。</div>';
    return;
  }
  out.innerHTML = '<div class="list">' + hit.map(function(d){
    var cardCls = d.cls === "ext" ? "extcard" : (d.cls === "herb" ? "herbcard" : "nocard");
    return '<div class="item ' + cardCls + '" tabindex="0" data-copy="' + esc(d.name + " " + d.slot) + '">' +
             '<div class="name">' +
               '<span class="txt">' + hl(d.name, keys) + '</span>' +
               (d.type ? '<span class="tag ' + d.cls + '">' + esc(d.type) + '</span>' : '') +
             '</div>' +
             '<div class="cslot">' + '<div class="slot ' + (d.cls === "ext" ? "ext" : "") + '">' + (hl(d.slot, keys) || "—") + '</div>' + '</div>' +
             '<div class="cslot2">' +
               (d.slot2 ? '<div class="slot2"><span class="k">庫</span>' + hl(d.slot2, keys) + '</div>' : '') +
               (d.brand ? '<div class="brand">' + esc(d.brand) + '</div>' : '') +
             '</div>' +
             '<div class="side">' + (d.note ? '<span class="cold">❄<br>冰庫</span>' : '') + '</div>' +
           '</div>';
  }).join("") + '</div>';

  // fitNames();  // 藥名固定大字，不縮
}

q.addEventListener("input", function(){
  $("#clear").style.display = q.value ? "block" : "none";
  render();
  bumpCount();   // 一有輸入就算一次（同一次查詢不重複）
});
$("#clear").addEventListener("click", function(){
  q.value = ""; $("#clear").style.display = "none"; render(); q.focus();
});
$("#refresh").addEventListener("click", load);

function copySlot(el){
  var s = el.getAttribute("data-copy") || "";
  if(navigator.clipboard){
    navigator.clipboard.writeText(s).then(function(){ toast("已複製 " + s); },
                                          function(){ toast(s); });
  }else{ toast(s); }
}
out.addEventListener("click", function(e){
  var d = e.target.closest(".item"); if(d) copySlot(d);
});
out.addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.key === " "){
    var d = e.target.closest(".item");
    if(d){ e.preventDefault(); copySlot(d); }
  }
});


callCount("view");   // 進頁面先顯示今日數字
load();
</script>
</body>
</html>
